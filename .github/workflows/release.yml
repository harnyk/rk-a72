name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches rk-a72-cli's Cargo.toml version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version=$(grep -m1 '^version' rk-a72-cli/Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          echo "tag version:    $tag_version"
          echo "Cargo.toml version: $cargo_version"
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "::error::Tag v$tag_version does not match rk-a72-cli's Cargo.toml version ($cargo_version)"
            exit 1
          fi

  build:
    needs: check-version
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: rk-a72.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: rk-a72
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: rk-a72
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install libudev (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build rk-a72-cli
        run: cargo build --release -p rk-a72 --target ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archiveName = "rk-a72-${{ github.ref_name }}-${{ matrix.target }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" -DestinationPath $archiveName
          echo "ARCHIVE_PATH=$archiveName" >> $env:GITHUB_ENV

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          archive_name="rk-a72-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          tar -czf "$archive_name" -C "target/${{ matrix.target }}/release" "${{ matrix.bin_name }}"
          echo "ARCHIVE_PATH=$archive_name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: rk-a72-${{ matrix.target }}
          path: ${{ env.ARCHIVE_PATH }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
