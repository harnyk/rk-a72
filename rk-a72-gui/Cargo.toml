[package]
name = "rk-a72-gui"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Graphical keymap editor for the wired RK A72 keyboard"
repository = "https://github.com/harnyk/rk-a72"

[dependencies]
rk-a72-keymap = { path = "../rk-a72-keymap" }
eframe = "0.31"
rfd = "0.15"
hidapi = { version = "2", default-features = false, features = ["linux-native-basic-udev"] }
